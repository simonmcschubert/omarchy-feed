# Moves the preview branch to each main commit that CI passed. Installed
# copies on the Preview channel (Settings › Updates) offer it the next time
# Feed opens, or within four hours while it is open (README.md, "Update";
# update, "channel").
#
# Only fast-forwards: the CI run of an older commit that ends after a newer
# one leaves preview where it is, and preview is never rewritten. Runs no
# code of the repository, only git. No concurrency group: GitHub keeps one
# pending run per group and drops the rest, which could drop the newest
# commit; runs that race retry the push instead.
# Only GitHub-owned actions pinned by commit SHA, as in ci.yml.

name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    name: Move preview to the commit
    # Pushes to main only; CI also runs for pull requests.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # push the preview branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # main and preview, to compare them

      - name: Fast-forward preview
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A run that ends meanwhile can move preview, so look again when
          # the push is refused. The fetch fails before the first preview,
          # and the push creates it.
          for attempt in 1 2 3; do
            if git fetch --quiet origin refs/heads/preview; then
              if git merge-base --is-ancestor "$COMMIT" FETCH_HEAD; then
                echo "preview is at $(git rev-parse FETCH_HEAD), which has $COMMIT already."
                exit 0
              fi
            fi
            # Without --force, so git refuses anything but a fast-forward.
            if git push origin "$COMMIT:refs/heads/preview"; then
              echo "preview is at $COMMIT now." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
